name: Desktop

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the installer
        working-directory: desktop
        shell: bash
        run: |
          gradle --no-daemon packageApp

      - uses: actions/upload-artifact@v4
        with:
          name: Nijatva-${{ matrix.name }}
          path: |
            desktop/build/jpackage/*.msi
            desktop/build/jpackage/*.exe
            desktop/build/jpackage/*.dmg
            desktop/build/jpackage/*.pkg
            desktop/build/jpackage/*.deb
            desktop/build/jpackage/*.rpm
            desktop/build/jpackage/Nijatva/**
          if-no-files-found: warn
