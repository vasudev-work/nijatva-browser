name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Refuse to build if a Google Play Services dependency appears
        run: |
          if ./gradlew -q app:dependencies --configuration releaseRuntimeClasspath \
               | grep -E "com\\.google\\.android\\.gms|com\\.google\\.firebase|play-services"; then
            echo "::error::A Google Play Services or Firebase dependency was resolved."
            exit 1
          fi

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nijatva-browser-debug
          path: app/build/outputs/apk/debug/*.apk
